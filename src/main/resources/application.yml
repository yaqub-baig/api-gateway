spring:
  application:
    name: gateway-api
  web:
    resources:
      # No default static/webjar handlers (/webjars/**, /**). The swagger-ui jar is served
      # only under /_docs/ui, behind DocsAuthFilter.
      add-mappings: false

server:
  # Only Apache (same machine) talks to the gateway; it is not reachable from outside.
  address: 127.0.0.1
  port: 8070
  shutdown: graceful

management:
  server:
    # Health endpoint on a separate loopback-only port, never on the public path.
    address: 127.0.0.1
    port: 8071
  endpoints:
    web:
      exposure:
        include: health

gateway:
  # name -> base URL. The name is the public path prefix: https://api.autoadda.ae/<name>/...
  upstreams:
    identity: http://127.0.0.1:8010
    garage: http://127.0.0.1:8020
    vehicle: http://127.0.0.1:8030
    quote: http://127.0.0.1:8050
    part: http://127.0.0.1:8060
    otherservice: http://127.0.0.1:9010

  allowed-origins:
    - https://autoadda.ae
    - https://www.autoadda.ae
    - https://panel.autoadda.ae
    - http://localhost:3000
    # The gateway's own host: the /_docs page calls /<service>/... from it. Behind Apache the
    # gateway sees plain http, so these same-origin calls look cross-origin to it.
    - https://api.autoadda.ae

  # Matched (case-insensitive, unanchored at the end) against the normalised path.
  # Same rule as the Apache block-internal.conf, with the service prefix in front.
  deny-pattern: "(?i)^/[^/]+/api/v1/(auth/(send-sms|send-email|update/role|remove/role)|notifications?/(send|test)|swagger-ui|v3/api-docs|actuator)"

  # Private combined Swagger UI at /_docs. OFF by default. Never put the password here;
  # enable it on the server with a separate config file (see README).
  docs:
    enabled: false
    username: docs
    password: ""
    api-docs-paths:
      - /api/v1/v3/api-docs
      - /v3/api-docs
    cache-seconds: 60
    fetch-timeout-seconds: 3
    max-spec-bytes: 5MB

  # JWT check on /<service>/** (see README "Authentication"). OFF by default.
  # mode: off | report | enforce. jwt-secret must be the same secret identity-api signs with;
  # set it on the server only (never here). Blank secret = off.
  auth:
    mode: "off"
    jwt-secret: ""
    # Send "ADMIN" instead of "ROLE_ADMIN" in X-User-Role, if a service expects that.
    strip-role-prefix: false
    # Any method on these needs the role, on top of a valid token.
    role-rules:
      - { pattern: "/identity/api/v1/auth/admin/**", role: ROLE_ADMIN }
      - { pattern: "/garage/api/v1/admin/**", role: ROLE_ADMIN }
      - { pattern: "/quote/api/v1/admin/**", role: ROLE_ADMIN }
    # "METHOD /pattern" (METHOD may be ANY). Served without a token, anonymously: the gateway
    # removes client identity headers, so services that need a user get none.
    # {id:\d+} matches a numeric id only, so "/garages/{id:\d+}" does not also open "/garages/search".
    # Built from the website, panel and autoaddaapp audits (2026-10-17).
    public-paths:
      # identity: sign-in, sign-up, OTP, token refresh. reset-password is NOT here: it uses the
      # 5-minute token from verify-reset-password-otp.
      - POST /identity/api/v1/auth/user/signin
      - POST /identity/api/v1/auth/user/signup
      - POST /identity/api/v1/auth/user/verify-otp
      - POST /identity/api/v1/auth/user/resend-otp
      - POST /identity/api/v1/auth/user/forgot-password
      - POST /identity/api/v1/auth/user/verify-reset-password-otp
      - POST /identity/api/v1/auth/user/refresh-token
      - GET /identity/api/v1/subscriptions/plans/active
      # images and files on every service (<img src> never sends a token)
      - GET /*/api/v1/uploads/**
      - 'GET /*/api/v1/mediafiles/{id:\d+}'
      # garage: public search and garage pages
      - GET /garage/api/v1/available-services
      - GET /garage/api/v1/expertise-categories
      - GET /garage/api/v1/garage-business-listings
      - GET /garage/api/v1/garage-business-listings/search
      - 'GET /garage/api/v1/garage-business-listings/{id:\d+}'
      - 'GET /garage/api/v1/garage-services/garage/{id:\d+}'
      - GET /garage/api/v1/garage-subscriptions/search
      - GET /garage/api/v1/garages/all
      - GET /garage/api/v1/garages/paginated
      - GET /garage/api/v1/garages/search/paginated
      - 'GET /garage/api/v1/garages/{id:\d+}'
      - 'GET /garage/api/v1/ratings/garage/{id:\d+}'
      - 'GET /garage/api/v1/ratings/garage/{id:\d+}/summary'
      # otherservice: category browsing
      - GET /otherservice/api/v1/service-categories
      - GET /otherservice/api/v1/service-categories/**
      # part: catalogue and vehicle make/model pickers
      - GET /part/api/v1/categories/toplevelcategories
      - 'GET /part/api/v1/categories/{id:\d+}'
      - 'GET /part/api/v1/engines/model/{id:\d+}'
      - GET /part/api/v1/makes
      - GET /part/api/v1/manufacturers
      - GET /part/api/v1/models
      - 'GET /part/api/v1/models/make/{id:\d+}'
      - GET /part/api/v1/products
      - POST /part/api/v1/products/search/paginated
      # quote: banners on public pages
      - GET /quote/api/v1/banners
      - GET /quote/api/v1/banners/page/*
      # vehicle: public listings and location pickers
      - GET /vehicle/api/v1/car-rental-listings/browse
      - 'GET /vehicle/api/v1/car-rental-listings/{id:\d+}'
      - GET /vehicle/api/v1/carpool-listings/browse
      - 'GET /vehicle/api/v1/carpool-listings/{id:\d+}'
      - GET /vehicle/api/v1/number-plate-listings/browse
      - 'GET /vehicle/api/v1/number-plate-listings/{id:\d+}'
      - GET /vehicle/api/v1/countries
      - GET /vehicle/api/v1/state-territories
      - GET /vehicle/api/v1/streets
      - GET /vehicle/api/v1/territory-areas
      - GET /vehicle/api/v1/plate-sources/tree
      - GET /vehicle/api/v1/vehicle-listing
      - GET /vehicle/api/v1/vehicle-listing/paginated
      - 'GET /vehicle/api/v1/vehicle-listing/{id:\d+}'

logging:
  level:
    com.autoadda.gateway: INFO
